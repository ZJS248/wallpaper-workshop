<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>接入示例 · 宿主页面（wallpaper-manager）</title>
<!--
  这是给父项目（wallpaper-manager）看的**接入示例**，不是本项目的一部分。
  直接打开它就能验证"父页面把 Steam Cookie 交给子页面"这条链路。

  真接入时，把下面 <script> 里的那段逻辑抄进 wallpaper-manager 即可。
-->
<style>
  :root { --line:#2a3f55; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:#0e1621; color:#c7d5e0;
         font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px;
           background:#1b2838; border-bottom:1px solid var(--line); }
  header b { color:#eaf2f8; }
  .pill { padding:1px 8px; border-radius:9px; font-size:11px; background:#223247; }
  .row { display:flex; gap:8px; margin-left:auto; }
  button, input { font:inherit; background:#1b2838; color:#c7d5e0;
                  border:1px solid var(--line); border-radius:3px; padding:5px 10px; }
  button:hover { background:#223247; color:#fff; cursor:pointer; }
  input { width:300px; }
  iframe { flex:1; border:0; width:100%; }
  #log { height:112px; overflow:auto; background:#0b1219; border-top:1px solid var(--line);
         padding:6px 10px; font:11px/1.6 ui-monospace,Consolas,monospace; color:#7b95ab; }
  #log b { color:#66c0f4; }
</style>
</head>
<body>

<header>
  <b>宿主页面（模拟 wallpaper-manager）</b>
  <span class="pill" id="state">等待子页面…</span>
  <div class="row">
    <input id="cookie" placeholder="把 Steam Cookie 粘到这里（模拟父项目已有的登录态）">
    <button onclick="pushCookie()">把 Cookie 推给子页面</button>
    <button onclick="cmd('search','初音')">命令：搜索「初音」</button>
    <button onclick="cmd('reset')">命令：重置筛选</button>
  </div>
</header>

<iframe id="ww" src="/"></iframe>
<div id="log"></div>

<script>
const frame = document.getElementById('ww');
const logEl = document.getElementById('log');
const stateEl = document.getElementById('state');

function log(msg) {
  const t = new Date().toLocaleTimeString('zh-CN');
  logEl.innerHTML = '<div>[' + t + '] ' + msg + '</div>' + logEl.innerHTML;
}

/** 子页面加载后会发 hello 来问登录态，父页面在这里回给它 */
window.addEventListener('message', function (e) {
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  if (d.type === 'wallpaper-workshop:hello') {
    log('<b>收到 hello</b>（子页面在要登录态）' + (d.need ? '，需要：' + d.need.join(',') : ''));
    stateEl.textContent = '子页面已就绪';
    // 父项目真接入时，这里读自己保存的 Cookie（或直接读 document.cookie）
    const c = document.getElementById('cookie').value.trim();
    if (c) pushCookie();
    else log('（输入框为空，未推送 Cookie —— 子页面会以"未登录"运行，浏览不受影响）');
  }

  if (d.type === 'wallpaper-workshop:state') {
    log('<b>子页面状态</b> ' + JSON.stringify(d));
  }
});

function pushCookie() {
  const c = document.getElementById('cookie').value.trim();
  if (!c) { log('输入框为空'); return; }
  frame.contentWindow.postMessage({ type: 'wallpaper-workshop:session', cookie: c }, '*');
  log('<b>已推送 Cookie</b>（' + c.length + ' 字节）');
}

function cmd(command, value) {
  frame.contentWindow.postMessage({ type: 'wallpaper-workshop:command', command: command, value: value }, '*');
  log('已下发命令：' + command + (value ? ' = ' + value : ''));
}

log('接入示例已加载。正常流程：子页面发 hello → 父页面回 session。');
</script>
</body>
</html>
