# ⚠️ pnpm 只要发现 pnpm-workspace.yaml 存在，就要求里面必须有 packages 字段；
# 缺了会直接 `ERROR packages field missing or empty` 而装不上依赖。
# 本仓库是单包（不是 monorepo），所以只有根目录这一个包。
packages:
  - '.'

# electron 的 postinstall 要下载运行时二进制（约 100MB+），放行它的构建脚本。
#
# 原文件这里写的是：
#     allowBuilds:
#       electron: set this to true or false
# —— 那是个**没填完的占位符**（值本身就是句说明文字），
# 而且 `allowBuilds` 并不是 pnpm 的字段，写了也不生效。
onlyBuiltDependencies:
  - electron
